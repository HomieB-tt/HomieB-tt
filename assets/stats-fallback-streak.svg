<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg3" x1="0" y1="0" x2="400" y2="150">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <style>
      @keyframes pulse-streak {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .streak-pulse { animation: pulse-streak 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="400" height="150" rx="12" fill="url(#cardBg3)" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Header -->
  <text x="20" y="30" fill="#ec4899" font-family="'Fira Code', monospace" font-size="14" font-weight="600">🔥 Streak Status</text>

  <!-- Current Streak -->
  <g class="streak-pulse">
    <circle cx="60" cy="70" r="25" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
    <text x="60" y="80" fill="#22d3ee" font-family="'Fira Code', monospace" font-size="22" font-weight="700" text-anchor="middle">42</text>
    <text x="60" y="100" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Days</text>
  </g>

  <!-- Stats -->
  <text x="130" y="55" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Longest Streak</text>
  <text x="130" y="75" fill="#22d3ee" font-family="'Fira Code', monospace" font-size="18" font-weight="700">128 days</text>

  <text x="130" y="100" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Contributions</text>
  <text x="130" y="120" fill="#8b5cf6" font-family="'Fira Code', monospace" font-size="18" font-weight="700">1200+ this year</text>

  <!-- Activity Dots -->
  <circle cx="280" cy="50" r="3" fill="#22d3ee" opacity="0.8"/>
  <circle cx="300" cy="50" r="3" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="320" cy="50" r="3" fill="#ec4899" opacity="0.8"/>
  <circle cx="340" cy="50" r="3" fill="#14b8a6" opacity="0.8"/>
  <circle cx="360" cy="50" r="3" fill="#22d3ee" opacity="0.8"/>

  <!-- Footer -->
  <line x1="20" y1="135" x2="380" y2="135" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
  <text x="20" y="148" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">Consistent developer • Keep the streak alive!</text>
</svg>
