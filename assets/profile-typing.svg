<svg width="900" height="60" viewBox="0 0 900 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="typingBgAnimated" x1="0" y1="0" x2="900" y2="60">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 49%, 100% { opacity: 1; }
        50%, 99% { opacity: 0; }
      }
      @keyframes typewriter {
        0% { width: 0; }
        100% { width: 850px; }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      .typing { animation: typewriter 4s steps(60) forwards; overflow: hidden; }
    </style>
  </defs>

  <rect width="900" height="60" rx="12" fill="url(#typingBgAnimated)" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Terminal Prompt with Animation -->
  <g class="typing">
    <text x="30" y="38" fill="#22d3ee" font-family="'Fira Code', monospace" font-size="16" font-weight="600">
      ~ <tspan fill="#8b5cf6">$</tspan> Mobile Engineer • Flutter • Swift • Dart • Rust • Building clean fast resilient systems
    </text>
  </g>

  <!-- Animated Cursor -->
  <g class="cursor">
    <rect x="880" y="22" width="2" height="20" fill="#22d3ee"/>
  </g>
</svg>
