<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridBg" x1="0" y1="0" x2="1200" y2="200">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" rx="12" fill="url(#gridBg)" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="35" fill="#22d3ee" font-family="'Fira Code', monospace" font-size="14" font-weight="600">CONTRIBUTION ACTIVITY GRID</text>

  <!-- Grid Placeholder -->
  <g opacity="0.4">
    <!-- Week rows -->
    <g fill="#22d3ee">
      <rect x="30" y="55" width="12" height="12" rx="2"/>
      <rect x="50" y="55" width="12" height="12" rx="2"/>
      <rect x="70" y="55" width="12" height="12" rx="2"/>
      <rect x="90" y="55" width="12" height="12" rx="2"/>
      <rect x="110" y="55" width="12" height="12" rx="2"/>

      <rect x="30" y="75" width="12" height="12" rx="2"/>
      <rect x="50" y="75" width="12" height="12" rx="2"/>
      <rect x="70" y="75" width="12" height="12" rx="2"/>
      <rect x="90" y="75" width="12" height="12" rx="2"/>
      <rect x="110" y="75" width="12" height="12" rx="2"/>

      <rect x="30" y="95" width="12" height="12" rx="2"/>
      <rect x="50" y="95" width="12" height="12" rx="2"/>
      <rect x="70" y="95" width="12" height="12" rx="2"/>
      <rect x="90" y="95" width="12" height="12" rx="2"/>
      <rect x="110" y="95" width="12" height="12" rx="2"/>

      <rect x="30" y="115" width="12" height="12" rx="2"/>
      <rect x="50" y="115" width="12" height="12" rx="2"/>
      <rect x="70" y="115" width="12" height="12" rx="2"/>
      <rect x="90" y="115" width="12" height="12" rx="2"/>
      <rect x="110" y="115" width="12" height="12" rx="2"/>
    </g>

    <!-- Intensity colors -->
    <g fill="#8b5cf6" opacity="0.7">
      <rect x="150" y="55" width="12" height="12" rx="2"/>
      <rect x="170" y="55" width="12" height="12" rx="2"/>
      <rect x="150" y="75" width="12" height="12" rx="2"/>
      <rect x="170" y="95" width="12" height="12" rx="2"/>
    </g>

    <g fill="#ec4899" opacity="0.8">
      <rect x="210" y="75" width="12" height="12" rx="2"/>
      <rect x="230" y="95" width="12" height="12" rx="2"/>
      <rect x="210" y="115" width="12" height="12" rx="2"/>
    </g>

    <g fill="#14b8a6" opacity="0.6">
      <rect x="270" y="55" width="12" height="12" rx="2"/>
      <rect x="290" y="75" width="12" height="12" rx="2"/>
      <rect x="310" y="95" width="12" height="12" rx="2"/>
    </g>
  </g>

  <!-- Legend -->
  <text x="30" y="165" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Less</text>
  <g opacity="0.3">
    <rect x="75" y="158" width="10" height="10" rx="2" fill="#22d3ee"/>
  </g>
  <g opacity="0.5">
    <rect x="95" y="158" width="10" height="10" rx="2" fill="#22d3ee"/>
  </g>
  <g opacity="0.7">
    <rect x="115" y="158" width="10" height="10" rx="2" fill="#8b5cf6"/>
  </g>
  <g opacity="0.9">
    <rect x="135" y="158" width="10" height="10" rx="2" fill="#ec4899"/>
  </g>
  <text x="160" y="165" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">More</text>

  <!-- Info -->
  <text x="30" y="190" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Last 52 weeks of activity • Contributions show commitment to open source and continuous development</text>
</svg>
