<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="50%" stop-color="#070C1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neon" x1="50" y1="50" x2="1150" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="420" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D1F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="340" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F29" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.10">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200 M0 360H1200" stroke="#22D3EE" stroke-width="1"/>
    <path d="M80 0V390 M160 0V390 M240 0V390 M320 0V390 M400 0V390 M480 0V390 M560 0V390 M640 0V390 M720 0V390 M800 0V390 M880 0V390 M960 0V390 M1040 0V390 M1120 0V390" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Horizontal Accent Lines -->
  <g opacity="0.25">
    <rect x="0" y="2" width="1200" height="2" fill="url(#neon)"/>
    <rect x="0" y="386" width="1200" height="2" fill="url(#neon)"/>
    <rect x="0" y="195" width="1200" height="1" fill="#14B8A6"/>
  </g>

  <!-- Glowing Cyberwave Vector -->
  <g filter="url(#glow)">
    <path d="M60 295C170 205 290 220 410 130C530 40 670 25 820 120C960 210 1050 190 1140 70" stroke="url(#neon)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="410" cy="130" r="6" fill="#14B8A6"/>
    <circle cx="820" cy="120" r="6" fill="#8B5CF6"/>
    <circle cx="1140" cy="70" r="6" fill="#EC4899"/>
  </g>

  <!-- Left Terminal Panel -->
  <g transform="translate(50, 36)">
    <rect width="410" height="152" rx="14" fill="url(#cardGrad1)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M0 14C0 6.26801 6.26801 0 14 0H396C403.732 0 410 6.26801 410 14V32H0V14Z" fill="#070D24" fill-opacity="0.8"/>
    <circle cx="20" cy="16" r="5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="5" fill="#10B981"/>
    <text x="70" y="21" fill="#64748B" font-family="'Fira Code', monospace" font-size="12">system_init.sh</text>

    <text x="20" y="58" fill="#22D3EE" font-family="'Fira Code', monospace" font-size="15" font-weight="600">&gt; boot_profile --mode overdrive</text>
    <text x="20" y="84" fill="#C084FC" font-family="'Fira Code', monospace" font-size="14">alias  : HomieB-tt</text>
    <text x="20" y="108" fill="#2DD4BF" font-family="'Fira Code', monospace" font-size="14">class  : mobile_engineer</text>
    <text x="20" y="132" fill="#F472B6" font-family="'Fira Code', monospace" font-size="14">spec   : flutter | swift | systems</text>
  </g>

  <!-- Right Panel -->
  <g transform="translate(810, 220)">
    <rect width="340" height="116" rx="14" fill="url(#cardGrad2)" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M0 14C0 6.26801 6.26801 0 14 0H326C333.732 0 340 6.26801 340 14V30H0V14Z" fill="#12071F" fill-opacity="0.8"/>
    <text x="16" y="20" fill="#EC4899" font-family="'Fira Code', monospace" font-size="11" font-weight="600">// SYSTEM ARSENAL</text>

    <text x="18" y="54" fill="#22D3EE" font-family="'Fira Code', monospace" font-size="13.5">stack = [Flutter, Swift, Rust, Python]</text>
    <text x="18" y="78" fill="#14B8A6" font-family="'Fira Code', monospace" font-size="13.5">roots = [networking, cybersec]</text>
    <text x="18" y="102" fill="#C084FC" font-family="'Fira Code', monospace" font-size="13.5">site  = homieb-tt.github.io</text>
  </g>

  <!-- Main Hero Typography -->
  <g transform="translate(52, 276)">
    <text x="0" y="32" fill="#F8FAFC" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.02em">Jeremiah Carlton</text>
    <text x="2" y="66" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="21" font-weight="600">Mobile Engineer // Flutter • Swift • iOS • Android</text>
    <text x="2" y="92" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16">networking roots • cybersec mindset • neon system energy</text>
  </g>
</svg>
